name: Build APK

# Сборка только по commit со словами [build apk] в описании (или вручную). Остальные commits ничего не собирают.
on:
  push:
    branches: [claude-fixes-2026-11-05]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libmtdev1 xclip
      - run: python -m pip install kivy==2.3.1
      - run: python -m py_compile main.py accounting.py transfer.py
      - run: xvfb-run -a python run_checks.py

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # хранить зашифрованный ключ в ветке signing-key и выпускать Release
    env:
      # Секрет; если браузер не даёт сохранить секрет — переменная репозитория (видна только владельцу).
      UCHET_KEY_PASS: ${{ secrets.UCHET_KEY_PASS || vars.UCHET_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing password
        run: |
          if [ "${#UCHET_KEY_PASS}" -lt 12 ]; then
            echo "::error::Нет пароля UCHET_KEY_PASS (секрет или переменная, минимум 12 символов). Без постоянного ключа сборка запрещена."
            exit 1
          fi

      - name: Get permanent signing key (create once)
        run: |
          set -euo pipefail
          KS_DIR="$RUNNER_TEMP/ks"; mkdir -p "$KS_DIR"; chmod 700 "$KS_DIR"
          KEY="$KS_DIR/uchet.keystore"
          if git fetch --depth 1 origin signing-key 2>/dev/null; then
            git show FETCH_HEAD:uchet-release.keystore.enc > "$KS_DIR/key.enc"
            git show FETCH_HEAD:fingerprint.txt > "$KS_DIR/fingerprint.txt"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$KS_DIR/key.enc" -out "$KEY" -pass env:UCHET_KEY_PASS \
              || { echo "::error::Пароль UCHET_KEY_PASS не подходит к сохранённому ключу"; exit 1; }
          else
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -alias uchet -keyalg RSA -keysize 4096 \
              -validity 36500 -storepass:env UCHET_KEY_PASS -keypass:env UCHET_KEY_PASS \
              -dname "CN=Alexey Uchet, O=Alexey-Print, C=RU"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KEY" -out "$KS_DIR/key.enc" -pass env:UCHET_KEY_PASS
            keytool -list -v -keystore "$KEY" -storepass:env UCHET_KEY_PASS -alias uchet \
              | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f' > "$KS_DIR/fingerprint.txt"
            WT="$RUNNER_TEMP/signing-branch"; git worktree add --detach "$WT"
            cd "$WT"; git checkout --orphan signing-key; git rm -rfq .
            cp "$KS_DIR/key.enc" uchet-release.keystore.enc; cp "$KS_DIR/fingerprint.txt" fingerprint.txt
            printf '%s\n' "Постоянный ключ подписи «Учёт» (com.aleksey.uchet2), зашифрован AES-256 паролем владельца." \
              "Без пароля бесполезен. Не удалять эту ветку: без ключа обновления приложения невозможны." > README.txt
            git add uchet-release.keystore.enc fingerprint.txt README.txt
            git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Encrypted permanent signing key"
            git push origin signing-key
          fi
          ACTUAL=$(keytool -list -v -keystore "$KEY" -storepass:env UCHET_KEY_PASS -alias uchet \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$(cat "$KS_DIR/fingerprint.txt")" || { echo "::error::Ключ не совпадает с закреплённым отпечатком"; exit 1; }
          echo "Отпечаток ключа: $ACTUAL"

      # Хранение скачанных инструментов Android и собранного Python между сборками (ускоряет в 2–3 раза).
      - name: Restore build tools cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/buildozer-home
            .buildozer
          # Меняется только при смене инструментов (Kivy, библиотек, p4a, NDK), не при каждой версии.
          key: buildozer-kivy2.3.1-as4k0.1.1-p4a1c9a4b-ndk28c-api33-root-v2

      - name: Build signed release APK in Docker
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/buildozer-home"
          docker run --rm \
            --entrypoint bash \
            -v "$PWD":/home/user/hostcwd \
            -v "$RUNNER_TEMP/buildozer-home":/root/.buildozer \
            -v "$RUNNER_TEMP/ks":/ks:ro \
            -e P4A_RELEASE_KEYSTORE=/ks/uchet.keystore \
            -e P4A_RELEASE_KEYALIAS=uchet \
            -e P4A_RELEASE_KEYSTORE_PASSWD="$UCHET_KEY_PASS" \
            -e P4A_RELEASE_KEYALIAS_PASSWD="$UCHET_KEY_PASS" \
            kivy/buildozer@sha256:92860ae3822fd533b90ab11f7c2272859980d34b791b1454a09a90e9849a5c7a \
            -c "git config --global --add safe.directory '*' && cd /home/user/hostcwd && yes | buildozer android release" > build-android.log 2>&1
          build_status=$?
          tail -n 160 build-android.log
          exit "$build_status"

      - name: Save Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-android.log

      - name: Verify APK is signed with the permanent key
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" bin
          APK=$(ls bin/*-release.apk)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee bin/CERTIFICATE.txt
          GOT=$(sed -n 's/.*certificate SHA-256 digest: //p' bin/CERTIFICATE.txt | head -1)
          test "$GOT" = "$(cat "$RUNNER_TEMP/ks/fingerprint.txt")" || { echo "::error::APK подписан не постоянным ключом"; exit 1; }
          git rev-parse HEAD > bin/SOURCE_COMMIT.txt
          sha256sum main.py accounting.py transfer.py buildozer.spec "$APK" > bin/SHA256SUMS.txt
          if unzip -l "$APK" | grep -q business_data; then echo "::error::В APK попала база"; exit 1; fi

      - name: Remove key from runner
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ks"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/buildozer-home" .buildozer 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-*/dists/*/bin 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: uchet-apk
          path: bin/*

      - name: Publish APK to permanent download link (branch apk-downloads)
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = //p' buildozer.spec)
          OUT="$RUNNER_TEMP/apk-downloads"; rm -rf "$OUT"; mkdir -p "$OUT"
          cp bin/*-release.apk "$OUT/uchet-latest.apk"
          cp bin/SHA256SUMS.txt bin/CERTIFICATE.txt "$OUT/"
          echo "Учёт $VER, commit $(git rev-parse --short HEAD)" > "$OUT/VERSION.txt"
          cd "$OUT"; git init -q; git checkout -q -b apk-downloads
          git add .; git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Учёт $VER"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" apk-downloads
          echo "Ссылка: https://github.com/$GITHUB_REPOSITORY/raw/apk-downloads/uchet-latest.apk"

      - name: Publish download page (GitHub Release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^version = //p' buildozer.spec)
          TAG="uchet-v$VER-$(git rev-parse --short HEAD)"
          gh release create "$TAG" bin/*-release.apk bin/SHA256SUMS.txt bin/CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Учёт $VER ($TAG)" \
            --notes "Новое приложение «Учёт» (com.aleksey.uchet2). Ставится рядом со старым «Uchet», старое не удалять."
